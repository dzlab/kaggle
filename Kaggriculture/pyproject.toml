[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kaggriculture-agent"
version = "0.1.0"
description = "Kaggriculture Kaggle agent scaffold"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments==1.32.7; python_version >= '3.11'",
]

[project.optional-dependencies]
training = [
    "numpy>=2,<3",
    "torch>=2,<3",
]
observability = [
    "weave>=0.51,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kagriculture_agent*"]
